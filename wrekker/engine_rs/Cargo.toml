[package]
name = "wrekker-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "wrekker_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3         = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy        = "0.22"
cpal         = "0.15"
atomic_float = "1.1"

[profile.release]
opt-level    = 3
lto          = "fat"
codegen-units = 1
panic        = "abort"

[features]
default = ["rubberband"]
extension-module = ["pyo3/extension-module"]
rubberband = []
