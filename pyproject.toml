[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wrekker"
version = "0.1.0"
description = "Open source DJ software for Linux with stem separation"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "soundfile>=0.12.1",
    "mutagen>=1.47",
    "onnxruntime>=1.16",
    "structlog>=23.1",
    "rich>=13.0",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "PyQt6>=6.4",
    "librosa>=0.10",
    "scipy>=1.10",
]

[project.optional-dependencies]
ai = [
    "demucs>=4.0.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "beat-this>=1.1.0",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["wrekker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
