name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  check-secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check for sensitive data
        run: python packaging/check-sensitive-data.py

  build-appimage:
    needs: check-secrets
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev librubberband-dev libfuse2 python3.11-dev ffmpeg wget
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install maturin
      - name: Build AppImage
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          ./packaging/appimage/build-appimage.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: "Wrekker-*.AppImage"

  # Windows and Flatpak builds are staged in packaging/ but not part of the
  # release yet — they have never run in CI. Re-add their jobs here once they
  # are verified so a broken build cannot block the AppImage release.

  release:
    needs: [build-appimage]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          name: "Wrekker ${{ github.ref_name }}"
          body: |
            ## Wrekker ${{ github.ref_name }}

            Stem-native DJ software for Linux.

            **Download the AppImage below**, make it executable and run it:

            ```
            chmod +x Wrekker-*.AppImage
            ./Wrekker-*.AppImage
            ```

            First launch downloads AI components once and caches them locally:
            PyTorch CPU, HTDemucs and Beat This!.
          files: |
            appimage/Wrekker-*.AppImage
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
