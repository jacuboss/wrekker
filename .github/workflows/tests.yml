name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python suite
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libasound2-dev: python-rtmidi builds against ALSA when no wheel matches.
          # The Qt libs let PyQt6 start under the offscreen platform plugin.
          sudo apt-get install -y libasound2-dev libegl1 libgl1 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      # The sync harness runs the real Transport and PLL on a virtual clock.
      # The short scenarios run above; this soak covers a full set length.
      - name: Sync soak
        run: python tests/sync_harness.py --minutes 30

  rust:
    name: Engine unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wrekker/engine_rs
      - name: cargo test
        working-directory: wrekker/engine_rs
        run: cargo test --release
